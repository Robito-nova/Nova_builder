[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-builder"
version = "0.1.0a1"
description = "Lightweight multi-language application builder and .nova packager"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "Robin Güneş" }]
dependencies = ["jsonschema>=4.21,<5"]

[project.scripts]
nova = "nova_builder.cli:main"

[tool.setuptools.package-data]
nova_builder = ["schemas/*.json"]
